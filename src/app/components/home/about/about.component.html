<section class="section about" id='about'>
    <div class="container">
        <div class="section-box">
            <div class="about-title" data-aos="fade-up">
                <h3 class="section-title">
                    <span class='n-section-title'>01.</span> {{"AboutMe.Title" | translate}}
                </h3>
            </div>
            <div class="row">
                <div class="col-12">
                    <div class="about-description">
                        <p *ngFor='let text of "AboutMe.Paragraphs" | translate' [innerHTML]="text | experience" data-aos="fade-up" data-aos-duration="1000">
                        </p>
                    </div>
                    <div class="skill-groups">
                        <div class="skill-group" *ngFor="let group of skillGroups; let i = index"
                             data-aos="fade-up" data-aos-duration="800" [attr.data-aos-delay]="i * 100">
                            <div class="skill-group-head">
                                <span class="skill-group-icon"><i [class]="group.icon"></i></span>
                                <h4>{{group.titleKey | translate}}</h4>
                            </div>
                            <ul class="skills-list">
                                <li class="skill-element" *ngFor="let skill of group.skills">{{skill}}</li>
                            </ul>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </div>
</section>
